<!DOCTYPE html>
<html>
<head>
    <title>CloudOps Dashboard</title>
</head>
<body>

    <h1>CloudOps Playground</h1>

    <hr>

    <h3>Hostname</h3>
    <p>{{ data.hostname }}</p>

    <h3>Operating System</h3>
    <p>{{ data.os }}</p>

    <h3>CPU Usage</h3>
    <p>{{ data.cpu }}%</p>

    <h3>Memory Usage</h3>
    <p>{{ data.memory }}%</p>

    <h3>Disk Usage</h3>
    <p>{{ data.disk }}%</p>

</body>
</html>
